name: Build Orvian Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Orvian icon
        shell: pwsh
        run: python scripts/make-icon.py

      - name: Publish self-contained Orvian
        shell: pwsh
        run: dotnet publish src/Orvian.Browser/Orvian.Browser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Download offline WebView2 Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Orvian.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-Setup
          path: dist/Orvian-Browser-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-win-x64
          path: src/Orvian.Browser/bin/Release/net8.0-windows/win-x64/publish/**
          if-no-files-found: error

      - name: Create GitHub release with installer
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-build.${{ github.run_number }}"
          gh release create $tag dist/Orvian-Browser-Setup-*.exe `
            --title "Orvian Browser 0.1.0 (Build ${{ github.run_number }})" `
            --notes "Automated Windows x64 build of Orvian Browser. Offline installer with self-contained .NET and bundled WebView2 runtime." `
            --prerelease
