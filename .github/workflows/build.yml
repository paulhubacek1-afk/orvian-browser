name: Build Orvian Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION.txt: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Orvian version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pillow

      - name: Generate Orvian icon
        shell: pwsh
        run: python scripts/make-icon.py

      - name: Publish self-contained Orvian
        shell: pwsh
        run: dotnet publish src/Orvian.Browser/Orvian.Browser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Download offline WebView2 Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe"
          if (-not (Test-Path "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe")) { throw "WebView2 runtime download failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$env:ORVIAN_VERSION" installer\Orvian.iss'

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\Orvian-Browser-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not created." }
          Write-Host "Built: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-Setup-${{ steps.version.outputs.version }}
          path: dist/Orvian-Browser-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-win-x64-${{ steps.version.outputs.version }}
          path: src/Orvian.Browser/bin/Release/net8.0-windows/win-x64/publish/**
          if-no-files-found: error

      - name: Prepare release notes
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:ORVIAN_VERSION))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success) {
            $match.Value.Trim() | Set-Content release-notes.md -Encoding utf8
          } else {
            "Orvian Browser v$env:ORVIAN_VERSION`n`nSiehe CHANGELOG.md für die vollständige Änderungsdokumentation." | Set-Content release-notes.md -Encoding utf8
          }
          Get-Content release-notes.md

      - name: Create GitHub release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:ORVIAN_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump VERSION.txt before publishing another change."
          }
          gh release create $tag dist/Orvian-Browser-Setup-*.exe `
            --repo $env:GITHUB_REPOSITORY `
            --title "Orvian Browser v$env:ORVIAN_VERSION" `
            --notes-file release-notes.md `
            --latest

# Build trigger: versioned releases with changelog
