name: Build Orvian Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orvian-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION.txt: $version"
          }

          [version]$parsed = $version
          if ($parsed.Major -lt 1) {
            throw "Release versions must start at 1.0.0 or newer."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Orvian version: $version"

      - name: Verify project version
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml]$project = Get-Content src/Orvian.Browser/Orvian.Browser.csproj
          $propertyGroup = $project.Project.PropertyGroup | Select-Object -First 1
          $expected = $env:ORVIAN_VERSION

          $checks = @{
            Version = [string]$propertyGroup.Version
            AssemblyVersion = [string]$propertyGroup.AssemblyVersion
            FileVersion = [string]$propertyGroup.FileVersion
          }

          if ($checks.Version -ne $expected) { throw "Version mismatch: $($checks.Version) != $expected" }
          if ($checks.AssemblyVersion -ne "$expected.0") { throw "AssemblyVersion mismatch: $($checks.AssemblyVersion) != $expected.0" }
          if ($checks.FileVersion -ne "$expected.0") { throw "FileVersion mismatch: $($checks.FileVersion) != $expected.0" }

      - name: Verify changelog entry
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($env:ORVIAN_VERSION)
          if ($changelog -notmatch "(?m)^## \[$escaped\]") {
            throw "CHANGELOG.md has no entry for [$env:ORVIAN_VERSION]."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Orvian.Browser/Orvian.Browser.csproj

      - name: Build validation
        shell: pwsh
        run: dotnet build src/Orvian.Browser/Orvian.Browser.csproj -c Release --no-restore --no-incremental

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pillow

      - name: Generate Orvian icon
        shell: pwsh
        run: python scripts/make-icon.py

      - name: Publish self-contained Orvian
        shell: pwsh
        run: dotnet publish src/Orvian.Browser/Orvian.Browser.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Download offline WebView2 Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe"
          if (-not (Test-Path "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe")) {
            throw "WebView2 runtime download failed."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$env:ORVIAN_VERSION" installer\Orvian.iss'

      - name: Verify installer
        id: installer
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem "dist\Orvian-Browser-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not created." }
          if ($installer.Length -lt 1MB) { throw "Installer looks invalid: $($installer.Length) bytes." }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Built: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Prepare release notes
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:ORVIAN_VERSION))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "Could not extract release notes for $env:ORVIAN_VERSION" }
          $match.Value.Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-Setup-${{ steps.version.outputs.version }}
          path: dist/Orvian-Browser-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-win-x64-${{ steps.version.outputs.version }}
          path: src/Orvian.Browser/bin/Release/net8.0-windows/win-x64/publish/**
          if-no-files-found: error
          retention-days: 14

      - name: Write SHA256 manifest
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
        run: |
          "Orvian-Browser-Setup-$env:ORVIAN_VERSION.exe  $env:INSTALLER_SHA256" | Set-Content "dist\SHA256SUMS.txt" -Encoding ascii

      - name: Upload SHA256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-SHA256-${{ steps.version.outputs.version }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:ORVIAN_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; replacing the verified installer."
            gh release upload $tag dist\Orvian-Browser-Setup-*.exe dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Orvian Browser v$env:ORVIAN_VERSION" --notes-file release-notes.md --latest
          } else {
            gh release create $tag dist\Orvian-Browser-Setup-*.exe dist\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Orvian Browser v$env:ORVIAN_VERSION" --notes-file release-notes.md --latest
          }

permissions:
  contents: write
