name: Build Orvian Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orvian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION.txt: $version" }
          $parsed = [version]$version
          if ($parsed.Major -lt 1) { throw "Release versions must start at 1.0.0 or newer." }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Orvian version: $version"

      - name: Verify project metadata
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml]$project = Get-Content src/Orvian.Browser/Orvian.Browser.csproj
          $pg = $project.Project.PropertyGroup | Select-Object -First 1
          $v = $env:ORVIAN_VERSION
          if ([string]$pg.Version -ne $v) { throw "Project Version does not match VERSION.txt." }
          if ([string]$pg.AssemblyVersion -ne "$v.0") { throw "AssemblyVersion does not match VERSION.txt." }
          if ([string]$pg.FileVersion -ne "$v.0") { throw "FileVersion does not match VERSION.txt." }

      - name: Verify changelog
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $v = [regex]::Escape($env:ORVIAN_VERSION)
          if ($text -notmatch "(?m)^## \[$v\]") { throw "CHANGELOG.md has no entry for [$env:ORVIAN_VERSION]." }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pillow

      - name: Generate Orvian icon
        shell: pwsh
        run: |
          python scripts/make-icon.py
          if (-not (Test-Path assets/orvian.ico)) { throw "Icon generation failed." }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Orvian.Browser/Orvian.Browser.csproj -r win-x64

      - name: Build validation
        shell: pwsh
        run: dotnet build src/Orvian.Browser/Orvian.Browser.csproj -c Release -r win-x64 --no-restore --no-incremental

      - name: Publish self-contained Orvian
        shell: pwsh
        run: |
          dotnet publish src/Orvian.Browser/Orvian.Browser.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false

      - name: Verify portable build
        shell: pwsh
        run: |
          $publish = "src/Orvian.Browser/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$publish/Orvian.exe")) { throw "Portable Orvian.exe was not produced." }
          $size = (Get-Item "$publish/Orvian.exe").Length
          if ($size -lt 1MB) { throw "Orvian.exe looks invalid: $size bytes." }
          Write-Host "Portable executable: $([math]::Round($size / 1MB, 2)) MB"

      - name: Download offline WebView2 Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe"
          if (-not (Test-Path "runtime/MicrosoftEdgeWebview2RuntimeInstallerX64.exe")) { throw "WebView2 runtime download failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$env:ORVIAN_VERSION" installer\Orvian.iss

      - name: Verify installer and create checksum
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\Orvian-Browser-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer EXE was not created." }
          if ($installer.Length -lt 1MB) { throw "Installer looks invalid: $($installer.Length) bytes." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$($installer.Name)  $hash" | Set-Content "dist\SHA256SUMS.txt" -Encoding ascii
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Prepare release notes
        shell: pwsh
        env:
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $v = [regex]::Escape($env:ORVIAN_VERSION)
          $pattern = "(?ms)^## \[$v\].*?(?=^## \[|\z)"
          $match = [regex]::Match($text, $pattern)
          if (-not $match.Success) { throw "Could not extract release notes." }
          $match.Value.Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Browser-${{ steps.version.outputs.version }}
          path: |
            dist/Orvian-Browser-Setup-*.exe
            dist/SHA256SUMS.txt
            release-notes.md
            src/Orvian.Browser/bin/Release/net8.0-windows/win-x64/publish/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download build package
        uses: actions/download-artifact@v4
        with:
          name: Orvian-Browser-${{ steps.version.outputs.version }}
          path: package

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORVIAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:ORVIAN_VERSION"
          $installer = Get-ChildItem "package\dist\Orvian-Browser-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Release installer is missing." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName "package\dist\SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Orvian Browser v$env:ORVIAN_VERSION" --notes-file "package\release-notes.md" --latest
          } else {
            gh release create $tag $installer.FullName "package\dist\SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --title "Orvian Browser v$env:ORVIAN_VERSION" --notes-file "package\release-notes.md" --latest
          }
